
name: Build and publish iLindung OCI image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract application ZIP
        run: |
          mkdir extracted
          unzip -q ilindung-prubsn-amc-build-package.zip -d extracted

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OCI image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: extracted/ilindung-prubsn-amc-build
          file: extracted/ilindung-prubsn-amc-build/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ilindung-prubsn-amc:latest

      - name: Show immutable image digest
        run: |
          echo "Image: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ilindung-prubsn-amc@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
