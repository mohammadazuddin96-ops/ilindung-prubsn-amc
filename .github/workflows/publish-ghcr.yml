name: Build and publish iLindung OCI image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract application ZIP and locate Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q ilindung-prubsn-amc-build-package.zip -d extracted

          echo "Files extracted from application package:"
          find extracted -maxdepth 5 -type f | sort | head -100

          DOCKERFILE="$(find extracted -type f -name Dockerfile -print -quit)"
          if [ -z "$DOCKERFILE" ]; then
            echo "::error::Dockerfile not found inside the uploaded ZIP."
            exit 1
          fi

          BUILD_CONTEXT="$(dirname "$DOCKERFILE")"
          if [ ! -f "$BUILD_CONTEXT/backend/package.json" ]; then
            echo "::error::backend/package.json is missing from build context: $BUILD_CONTEXT"
            exit 1
          fi
          if [ ! -f "$BUILD_CONTEXT/frontend/index.html" ]; then
            echo "::error::frontend/index.html is missing from build context: $BUILD_CONTEXT"
            exit 1
          fi

          echo "Located Dockerfile: $DOCKERFILE"
          echo "Build context: $BUILD_CONTEXT"
          echo "DOCKERFILE=$DOCKERFILE" >> "$GITHUB_ENV"
          echo "BUILD_CONTEXT=$BUILD_CONTEXT" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OCI image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ilindung-prubsn-amc:latest

      - name: Show immutable image digest
        run: |
          echo "Image: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ilindung-prubsn-amc@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
